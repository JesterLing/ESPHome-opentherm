esphome:
  name: "heater"
  comment: "Управление отоплением Bosch 6000 на основе OpenTherm"

external_components:
  - source:
      type: local
      path: components

esp8266:
  board: d1_mini
  restore_from_flash: true

preferences:
  flash_write_interval: 1min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s

logger:
  level: DEBUG # if all is well, you can replace it with WARN

api:

ota:
  - platform: esphome

one_wire: # built-in temperature sensor on Ihor Melnyk`s OpenThem Shield
  - platform: gpio
    pin: GPIO14 # i put it on the warm floor

opentherm:
  in_pin: 4 # set up your pins
  out_pin: 5
  # CH is requested only when the setpoint is above 0, the setpoint is driven by the boiler climate
  ch_enable: true
  # DHW is controlled by the "Boiler hot water" switch
  dhw_enable: true
  controller_product_type: 1 # MasterVersion 0x013F, as the original thermostat did
  controller_product_version: 63
  controller_id: 1 # replaced below by the boiler member ID
  before_send:
    then:
      - lambda: |-
          // MConfigMMemberIDcode: answer the boiler with its own member ID (read from SConfigSMemberIDcode before)
          if (x.id == 2 && !std::isnan(id(boiler_member_id).state))
            x.valueLB = (uint8_t) id(boiler_member_id).state;

select:
  - platform: template
    name: "Режим работы"
    options:
      - Автоматический PID
      - Ручной
    icon: mdi:home-thermometer
    optimistic: true
    restore_value: true
    id: mode_select

number:
  - platform: template
    name: "Интервал"
    unit_of_measurement: "min"
    mode: slider
    optimistic: true
    min_value: 0
    max_value: 60
    initial_value: 10
    step: 1
    id: interval_number

  - platform: template
    name: "Нагрев до"
    unit_of_measurement: "°C"
    mode: slider
    optimistic: true
    min_value: 40
    max_value: 85
    initial_value: 40
    step: 1
    id: ch_temp_number

  - platform: opentherm
    t_set:
      id: ch_setpoint
      name: "Boiler CH setpoint"
      internal: true # written by the boiler climate
      min_value: 0
      max_value: 85
      initial_value: 0 # on boot, so that the boiler does not heat before the thermostat state is restored

switch:
  - platform: opentherm
    dhw_enable:
      name: "Boiler hot water"
      icon: mdi:coolant-temperature
      restore_mode: RESTORE_DEFAULT_OFF

  - platform: restart
    name: "Boiler Restart"

  - platform: template
    name: "PID Climate Autotune"
    turn_on_action:
      - climate.pid.autotune:
          id: pid_climate
          negative_output: 0%
    entity_category: config

sensor:
  - platform: homeassistant
    id: house_temp_sensor
    entity_id: sensor.mj_ht_v1_temperature # your temperature sensor from HA

  - platform: pid
    name: "PID Climate Result"
    entity_category: diagnostic
    type: RESULT
  - platform: pid
    name: "PID Climate HEAT"
    type: HEAT
    entity_category: diagnostic
  - platform: pid
    name: "PID Climate ERROR"
    type: ERROR
    entity_category: diagnostic

  - platform: dallas_temp # https://esphome.io/components/sensor/dallas_temp.html
    address: 0x703C01F095AC1E28
    name: "Warm floor temperature"
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3

  - platform: opentherm
    t_boiler:
      id: boiler_ch_temp
      name: "Boiler CH Temp"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - delta: 0.5
    t_dhw:
      name: "Boiler DHW Temp"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - delta: 0.5
    rel_mod_level:
      name: "Boiler Rel Mod Level"
      unit_of_measurement: "%"
      icon: mdi:percent
      accuracy_decimals: 1
    dhw_flow_rate:
      name: "Boiler Water Flow Rate"
      unit_of_measurement: "л/мин"
      icon: mdi:approximately-equal
      accuracy_decimals: 1
    # ch_pressure:
    #   name: "Boiler CH Pressure"
    # t_outside:
    #   name: "Boiler Outside Temp"
    # t_ret:
    #   name: "Boiler Return Temp"
    oem_fault_code:
      id: boiler_oem_fault_code
      internal: true
    # read once at startup, the values are only logged as before
    device_id:
      id: boiler_member_id
      internal: true
    device_type:
      id: boiler_device_type
      internal: true
    device_version:
      id: boiler_device_version
      internal: true

binary_sensor:
  - platform: opentherm
    flame_on:
      id: boiler_flame
      name: "Boiler flame"
      icon: mdi:fire
    ch_active:
      id: boiler_ch_active
      internal: true
    fault_indication:
      id: boiler_fault
      internal: true
    diagnostic_indication:
      id: boiler_diagnostic
      internal: true
    service_request:
      id: boiler_service_request
      internal: true
    low_water_pressure:
      id: boiler_low_water_pressure
      internal: true
    flame_fault:
      id: boiler_flame_fault
      internal: true
    air_pressure_fault:
      id: boiler_air_pressure_fault
      internal: true
    water_over_temp:
      id: boiler_water_over_temp
      internal: true
    # read once at startup, the values are only logged as before
    dhw_present:
      id: boiler_dhw_present
      internal: true
    control_type_on_off:
      id: boiler_control_type_on_off
      internal: true
    cooling_supported:
      id: boiler_cooling_supported
      internal: true
    dhw_storage_tank:
      id: boiler_dhw_storage_tank
      internal: true
    controller_pump_control_allowed:
      id: boiler_pump_control_allowed
      internal: true
    ch2_present:
      id: boiler_ch2_present
      internal: true

text_sensor:
  - platform: template
    name: "Boiler Status"
    icon: mdi:sync
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (id(boiler_diagnostic).state)
        return {"Режим диагностики"};
      if (!id(boiler_fault).state)
        return {"OK"};
      std::string text = "Ошибка E";
      if (!std::isnan(id(boiler_oem_fault_code).state))
        text += to_string((int) id(boiler_oem_fault_code).state);
      if (id(boiler_service_request).state)
        text += " Требуется сервис";
      if (id(boiler_low_water_pressure).state)
        text += " Низкое давление воды";
      if (id(boiler_flame_fault).state)
        text += " Ошибка по газу/огню";
      if (id(boiler_air_pressure_fault).state)
        text += " Ошибка по тяге воздуха";
      if (id(boiler_water_over_temp).state)
        text += " Перегрев теплоносителя";
      return {text};

climate:
  - platform: pid
    id: pid_climate
    sensor: house_temp_sensor
    default_target_temperature: 10°C
    heat_output: pid_output
    control_parameters: # enter your values here
      kp: 0.38197
      ki: 0.01012
      kd: 3.60387

  - platform: boiler_climate
    id: ot
    name: "boiler"
    house_temp: house_temp_sensor
    pid_climate: pid_climate
    pid_output:
      id: pid_output
    mode_select: mode_select
    interval_number: interval_number
    ch_temp_number: ch_temp_number
    ch_setpoint: ch_setpoint
    boiler_temp: boiler_ch_temp
    flame_on: boiler_flame
    ch_active: boiler_ch_active
    heat_interval:
      name: "Boiler Heat Interval"
      icon: mdi:camera-timer
